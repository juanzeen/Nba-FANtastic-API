name: NBA FANtastic API CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: "0.12.5"
    - uses: actions/checkout@v6
    - name: Set up Python
      run: uv python install
    - name: Install the project
      run: uv sync --locked --all-extrar --dev
    - name: Check ident
      run: uv format --check
    - name: Run tests
      run: uv run pytest
